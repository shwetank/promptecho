[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptecho"
version = "0.1.3"
description = "Record & replay for LLM API calls — like vcrpy/nock, built for LLM traffic."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Shwetank Dixit", email = "shwetank@bettersense.ai" }]
keywords = ["llm", "testing", "vcr", "record-replay", "pytest", "anthropic", "openai", "mock"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: Mocking",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/shwetank/promptecho"
Repository = "https://github.com/shwetank/promptecho"
Documentation = "https://github.com/shwetank/promptecho#readme"
Changelog = "https://github.com/shwetank/promptecho/blob/main/CHANGELOG.md"
Issues = "https://github.com/shwetank/promptecho/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "anthropic", "openai"]

[project.entry-points.pytest11]
promptecho = "promptecho.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/promptecho"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
