[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptecho"
version = "0.1.0"
description = "Record & replay for LLM API calls — like vcrpy/nock, built for LLM traffic."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["llm", "testing", "vcr", "record-replay", "pytest", "anthropic", "openai", "mock"]
dependencies = [
    "httpx>=0.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "anthropic", "openai"]

[project.entry-points.pytest11]
promptecho = "promptecho.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/promptecho"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
