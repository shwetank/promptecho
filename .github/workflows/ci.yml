name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extra, so the real-SDK example test runs)
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests examples -q

  # The floor we claim in pyproject: oldest supported httpx on oldest Python.
  oldest-httpx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install -e ".[dev]" "httpx==0.24.*"
      - run: pytest tests -q
